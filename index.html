<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARNING: SYSTEM OVERLOAD</title>
    <style>
        /* --- 全局设置 --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- 背景 Canvas (星空穿越) --- */
        #warp-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        /* --- 晕影效果 (聚焦中心) --- */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 120%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- 文字容器 --- */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            transform-style: preserve-3d;
        }

        /* --- 核心文字样式 --- */
        .mega-text {
            font-size: 8vw; /* 随屏幕宽度自动调整大小 */
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            user-select: none;
            /* 霓虹发光 */
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.8),
                0 0 20px rgba(0, 255, 255, 0.8),
                0 0 40px rgba(0, 255, 255, 0.8),
                0 0 80px rgba(0, 255, 255, 0.8);
            animation: pulse 2s infinite alternate;
        }

        /* --- 故障特效层 (Glitch Layers) --- */
        .mega-text::before,
        .mega-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000; /* 背景色遮罩 */
        }

        /* 红蓝偏移层 1 */
        .mega-text::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip-path: inset(44% 0 61% 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        /* 红蓝偏移层 2 */
        .mega-text::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9;
            clip-path: inset(20% 0 60% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        /* --- 警告副标题 --- */
        .sub-text {
            font-family: 'Courier New', Courier, monospace;
            color: #ff0055;
            font-size: 1.5vw;
            margin-top: 20px;
            letter-spacing: 5px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border: 1px solid #ff0055;
            box-shadow: 0 0 10px #ff0055;
            display: inline-block;
            animation: blink 0.2s infinite;
        }

        /* --- 动画关键帧 --- */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 20px cyan, 0 0 50px cyan, 0 0 100px white; }
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            55% { opacity: 1; }
            100% { opacity: 1; }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(60% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .mega-text { font-size: 15vw; letter-spacing: 0; }
            .sub-text { font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- 晕影遮罩 -->
    <div class="vignette"></div>
    
    <!-- 星空背景 -->
    <canvas id="warp-canvas"></canvas>

    <!-- 主内容 -->
    <div class="content">
        <!-- 重点：这里 data-text 属性必须和文字内容一致，用于生成故障镜像 -->
        <h1 class="mega-text" data-text="刘神帅裂苍穹">刘神帅裂苍穹</h1>
        <div class="sub-text">WARNING: HANDSOMENESS OVERLOAD</div>
    </div>

    <script>
        // --- 星空穿越特效 ---
        const canvas = document.getElementById('warp-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        // 星星数量，越多越密集
        const maxStars = 600; 
        // 飞行速度，越大越快
        const speed = 25; 

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = [];
            for (let i = 0; i < maxStars; i++) {
                stars.push({
                    x: Math.random() * width - width / 2,
                    y: Math.random() * height - height / 2,
                    z: Math.random() * width
                });
            }
        }

        function draw() {
            // 背景填充，形成拖尾效果 (0.1 透明度)
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = "#00ffff"; // 星星颜色：青色
            
            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.z -= speed;

                if (star.z <= 0) {
                    star.x = Math.random() * width - width / 2;
                    star.y = Math.random() * height - height / 2;
                    star.z = width;
                }

                let k = 128.0 / star.z;
                let px = star.x * k + width / 2;
                let py = star.y * k + height / 2;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    let size = (1 - star.z / width) * 3;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
